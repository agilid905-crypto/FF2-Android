
name: Build Feeding Frenzy 2 Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'FF2_Android_Prototype.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: |
          test -f FF2_Android_Prototype.zip
          mkdir -p extracted
          unzip -q FF2_Android_Prototype.zip -d extracted

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: File settings.gradle tidak ditemukan."
            echo "Periksa struktur ZIP proyek."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          APK="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/FF2-Android-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FF2-Android-APK
          path: FF2-Android-debug.apk
          if-no-files-found: error
          retention-days: 7
